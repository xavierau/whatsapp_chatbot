[project]
name = "whatsapp-chatbot"
version = "0.1.0"
description = "AI-powered WhatsApp chatbot using DSPy, Gemini LLM, and Meta Cloud API"
readme = "README.md"
requires-python = ">=3.13"
authors = [
    { name = "Xavier Au" }
]

dependencies = [
    # Web Framework
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.6.0",
    # LLM & AI
    "dspy-ai>=2.5.0",
    "google-generativeai>=0.8.0",
    "langfuse>=2.53.0",
    # Database
    "asyncpg>=0.30.0",
    "sqlalchemy>=2.0.36",
    "alembic>=1.14.0",
    "pgvector>=0.3.6",
    # WhatsApp / HTTP
    "httpx>=0.28.0",
    "requests>=2.32.0",
    # Utilities
    "python-dotenv>=1.0.1",
    "python-multipart>=0.0.20",
    "tenacity>=9.0.0",
    "notebook>=7.4.7",
    "nest-asyncio>=1.6.0",
    "google-genai>=1.46.0",
    "greenlet>=3.2.4",
    "openinference-instrumentation-dspy>=0.1.30",
]

[project.optional-dependencies]
dev = [
    # Testing
    "pytest>=8.3.0",
    "pytest-asyncio>=0.25.0",
    "pytest-cov>=6.0.0",
    "pytest-mock>=3.14.0",
    "httpx>=0.28.0",

    # Code Quality
    "ruff>=0.8.0",
    "mypy>=1.13.0",
    "black>=24.10.0",

    # Development Tools
    "ipython>=8.30.0",
    "pre-commit>=4.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
asyncio_mode = "auto"
markers = [
    "integration: marks tests as integration tests (deselect with '-m \"not integration\"')",
]
addopts = [
    "--strict-markers",
    "--strict-config",
    "--cov=src",
    "--cov-report=term-missing:skip-covered",
    "--cov-report=html",
    "--cov-report=xml",
]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "N",   # pep8-naming
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "S",   # flake8-bandit (security)
]
ignore = [
    "E501",  # line too long (handled by formatter)
    "S101",  # use of assert (allowed in tests)
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101"]

[tool.mypy]
python_version = "3.13"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
plugins = ["pydantic.mypy"]

[tool.black]
line-length = 100
target-version = ["py313"]
